name: Release binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            cross: true
          - name: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-amd64
          - name: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
        binary:
          - name: atpcid
            package: atproto-dasl
            features: clap
          - name: atpmcp
            package: atpmcp
            features: ""
          - name: atpxrpc
            package: atpxrpc
            features: ""
          - name: atptid
            package: atproto-record
            features: clap

    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.name }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.name }}-${{ matrix.binary.name }}

      - name: Install cross
        if: matrix.target.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          FEATURES="${{ matrix.binary.features }}"
          BUILD_CMD="cargo"
          if [ "${{ matrix.target.cross }}" = "true" ]; then
            BUILD_CMD="cross"
          fi
          if [ -n "$FEATURES" ]; then
            $BUILD_CMD build --release --target ${{ matrix.target.name }} --features "$FEATURES" --bin ${{ matrix.binary.name }} -p ${{ matrix.binary.package }}
          else
            $BUILD_CMD build --release --target ${{ matrix.target.name }} --bin ${{ matrix.binary.name }} -p ${{ matrix.binary.package }}
          fi

      - name: Package binary
        run: |
          cp target/${{ matrix.target.name }}/release/${{ matrix.binary.name }} ${{ matrix.binary.name }}-${{ matrix.target.suffix }}
          chmod +x ${{ matrix.binary.name }}-${{ matrix.target.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary.name }}-${{ matrix.target.suffix }}
          path: ${{ matrix.binary.name }}-${{ matrix.target.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
