[package]
name = "atproto-oauth-axum"
version = "0.14.5"
description = "Axum web framework integration for AT Protocol OAuth workflows"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-oauth-axum"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atproto-oauth-tool"
test = false
bench = false
doc = true
required-features = ["clap"]

[dependencies]
atproto-identity.workspace = true
atproto-record.workspace = true
atproto-oauth.workspace = true

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
elliptic-curve.workspace = true
hickory-resolver.workspace = true
rand.workspace = true
reqwest-chain.workspace = true
reqwest-middleware.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
axum.workspace = true
http.workspace = true
clap = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

zeroize = { workspace = true, optional = true }

[features]
default = ["hickory-dns"]
clap = ["dep:clap", "dep:rpassword", "dep:secrecy"]
zeroize = ["dep:zeroize", "atproto-identity/zeroize", "atproto-oauth/zeroize"]
hickory-dns = ["atproto-identity/hickory-dns", "atproto-oauth/hickory-dns"]

[lints]
workspace = true
