[package]
name = "atproto-space"
version = "0.15.0-rc.4"
description = "AT Protocol permissioned-data spaces — primitives for the 0016 Permissioned Data draft (LtHash, signed commits, delegation-token/space-credential JWTs)"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-space"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
atproto-dasl.workspace = true
# Declared rather than inherited, because Cargo refuses `default-features =
# false` on an inherited dependency -- and defaults off is what makes this
# crate's "no network dependencies" a fact rather than an aspiration. It uses
# `atproto_identity::key` and `atproto_record::tid`, both of which are in the
# pure half of those crates; the defaults would have pulled an HTTP client, an
# async runtime and a DNS resolver in behind them. The versions have to be
# repeated here; a release bump has to touch them, and CI requires them to
# match the workspace.
atproto-identity = { version = "0.15.0-rc.4", path = "../atproto-identity", default-features = false }
atproto-record = { version = "0.15.0-rc.4", path = "../atproto-record", default-features = false }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
hkdf = "0.13"
hmac = "0.13"
rand.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []

[lints]
workspace = true
