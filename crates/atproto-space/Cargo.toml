[package]
name = "atproto-space"
version = "0.15.0-rc.1"
description = "AT Protocol permissioned-data spaces — primitives for the 0016 Permissioned Data draft (LtHash, signed commits, delegation-token/space-credential JWTs)"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-space"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
atproto-dasl.workspace = true
atproto-identity.workspace = true
atproto-record.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
hkdf = "0.13"
hmac = "0.13"
rand.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []

[lints]
workspace = true
