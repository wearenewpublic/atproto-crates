[package]
name = "atproto-identity"
version = "0.15.0-rc.2"
description = "AT Protocol identity management - DID resolution, handle resolution, and cryptographic operations"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-identity"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atproto-identity-resolve"
test = false
bench = false
doc = true
required-features = ["clap", "hickory-dns"]

[[bin]]
name = "atproto-identity-sign"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-identity-validate"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-identity-key"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-identity-plc-audit"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-identity-plc-fork-viz"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atpdid"
test = false
bench = false
doc = true
required-features = ["clap", "hickory-dns"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
data-encoding.workspace = true
ecdsa.workspace = true
ed25519-dalek.workspace = true
elliptic-curve.workspace = true
hickory-resolver = { workspace = true, optional = true }
idna.workspace = true
k256 = { workspace = true, features = ["jwk"] }
lru = { workspace = true, optional = true }
multibase.workspace = true
p256 = { workspace = true, features = ["jwk"] }
p384 = { workspace = true, features = ["jwk"] }
atproto-dasl.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4"

[features]
default = ["lru", "hickory-dns"]
lru = ["dep:lru"]
clap = ["dep:clap"]
zeroize = ["dep:zeroize"]
hickory-dns = ["dep:hickory-resolver"]

[lints]
workspace = true
