[package]
name = "atproto-client"
version = "0.15.0-rc.4"
description = "HTTP client for AT Protocol services with OAuth and identity integration"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-client"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atproto-client-app-password"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-client-auth"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-client-dpop"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-client-put-record"
test = false
bench = false
doc = true

[dependencies]
atproto-dasl.workspace = true
atproto-identity.workspace = true
atproto-oauth.workspace = true
atproto-record.workspace = true

anyhow.workspace = true
reqwest-middleware.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
urlencoding.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[dev-dependencies]
# The DPoP transport tests script a real socket: the nonce dance is a property
# of what goes on the wire and how many times, which a faked response cannot
# show. A hand-rolled listener keeps that from costing a test-server crate.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
# Reads the `nonce` claim back out of a minted proof.
base64.workspace = true

[features]
default = ["hickory-dns"]
clap = ["dep:clap", "dep:rpassword", "dep:secrecy"]
hickory-dns = ["atproto-identity/hickory-dns", "atproto-oauth/hickory-dns"]

[lints]
workspace = true
