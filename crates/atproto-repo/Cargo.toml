[package]
name = "atproto-repo"
version = "0.15.0-rc.2"
description = "AT Protocol repository handling - CAR v1 serialization and Merkle Search Tree operations"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-repo"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atproto-repo-car"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atproto-repo-mst"
test = false
bench = false
doc = true
required-features = ["clap"]

[dependencies]
atproto-dasl.workspace = true

anyhow.workspace = true
cid.workspace = true
multihash.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "fs", "sync"] }
tempfile.workspace = true
tracing.workspace = true

clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4"
tokio = { workspace = true, features = ["macros", "rt", "fs"] }

[features]
default = []
clap = ["dep:clap"]
http = ["dep:reqwest"]

[lints]
workspace = true
