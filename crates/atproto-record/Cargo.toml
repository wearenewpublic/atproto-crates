[package]
name = "atproto-record"
version = "0.15.0-rc.4"
description = "AT Protocol record signature operations - cryptographic signing and verification for AT Protocol records"
readme = "README.md"
homepage = "https://tangled.org/ngerakines.me/atproto-crates"
documentation = "https://docs.rs/atproto-record"

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "atproto-record-cid"
test = false
bench = false
doc = true
required-features = ["clap"]

[[bin]]
name = "atptid"
test = false
bench = false
doc = true
required-features = ["clap"]

[dependencies]
# Declared rather than inherited from the workspace, because Cargo refuses
# `default-features = false` on an inherited dependency -- and defaults off is
# the point. A consumer that wants the lexicon types gets them without an HTTP
# client, an async runtime, or a DNS resolver. The `aturi` parser and several
# error variants still need this crate; none of them needs its network half.
# The version has to be repeated here; a release bump has to touch it.
atproto-identity = { version = "0.15.0-rc.4", path = "../atproto-identity", default-features = false }

anyhow.workspace = true
atproto-dasl = { workspace = true, optional = true }
base64.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

tokio = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, optional = true }
cid.workspace = true
multihash.workspace = true
sha2.workspace = true

[dev-dependencies]
async-trait.workspace = true
# A DAG-CBOR byte string, so the round-trip test exercises `visit_bytes`
# rather than an array of integers.
serde_bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["hickory-dns", "resolve"]

# Identity resolution and DAG-CBOR record encoding.
#
# Off, this crate is the lexicon type definitions, AT-URI parsing, TIDs,
# datetimes and bytes -- pure data with no I/O anywhere in the tree. That is
# what lets a consumer with a no-network rule import the wire types rather
# than redeclare them, and a wire format maintained in two places is one that
# will diverge.
resolve = ["atproto-identity/resolve", "dep:atproto-dasl"]

clap = ["dep:clap", "resolve"]
hickory-dns = ["atproto-identity/hickory-dns", "resolve"]

[lints]
workspace = true
