when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: "nixery"

# `rustup` rather than nixpkgs `cargo`/`rustc`/`clippy`, so the toolchain comes
# from `rust-toolchain.toml` instead of whatever version the nixpkgs channel
# happens to carry. Unpinned, CI and local development ran different compilers
# and disagreed about lints — a `clippy::const_is_empty` failure reached `main`
# green from a developer machine.
dependencies:
  nixpkgs:
    - rustup
    - git
    - pkg-config
    - openssl
    - cmake
    - gcc
    # From nixpkgs rather than `cargo install cargo-audit`, which would build
    # the tool from source on every run.
    - cargo-audit

steps:
  # Installs the toolchain named in rust-toolchain.toml and prints it, so the
  # version under test is visible in the log rather than inferred.
  - name: "toolchain"
    command: rustup show active-toolchain && cargo clippy --version

  # The compiler version is declared in five places that have to agree, and
  # nothing tied them together: `rust-toolchain.toml`, `rust-version` in the
  # workspace Cargo.toml, and the builder stage of each of the three
  # Dockerfiles. The raise to 1.97 updated the first three and left
  # `Dockerfile.pds` -- the image `railway.toml` actually deploys -- on 1.90,
  # and `crates/atproto-pds/Dockerfile` on 1.85, where it had been since the
  # MSRV was 1.85. Neither failed: every image copies `rust-toolchain.toml` in,
  # so rustup downloads the pinned toolchain and the `FROM` line becomes a
  # comment that lies. This step reads the version from `rust-toolchain.toml`
  # and requires the other four to name it.
  - name: "toolchain pins"
    command: V=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml) && echo "toolchain $V" && grep -q "^rust-version = \"$V\"$" Cargo.toml && grep -q "^FROM rust:$V-" Dockerfile && grep -q "^FROM rust:$V-" Dockerfile.pds && grep -q "^ARG RUST_VERSION=$V$" crates/atproto-pds/Dockerfile

  # The `dasl-testing` submodule carries the DASL CBOR compliance fixtures.
  # Without it `cargo test` fails 13 cases in `atproto-dasl` on a missing
  # fixture file, so the checkout has to be recursive for the suite to mean
  # anything. The AT Protocol interop vectors are vendored at `tests/interop/`
  # rather than submoduled and need no setup.
  - name: "submodules"
    command: git submodule update --init --recursive

  - name: "fmt"
    command: cargo fmt --all -- --check

  # `--all-targets` covers tests, benches and examples, not just the library
  # and binary targets.
  - name: "clippy"
    command: cargo clippy --workspace --all-targets -- -D warnings

  # Plain `--workspace` rather than `--all-targets`, because `--all-targets`
  # silently drops doctests and this workspace documents its public API with
  # runnable examples.
  - name: "test"
    command: cargo test --workspace

  # Three dependencies are declared rather than inherited, because Cargo
  # refuses `default-features = false` on a workspace-inherited dependency and
  # defaults off is the whole point at each of them. That repeats the version,
  # and a repeated version drifts silently -- the release bump updates
  # `workspace.dependencies` and these keep pointing at the version before it,
  # which resolves to a stale published crate rather than the sibling path.
  # This requires them all to agree.
  - name: "path dependency version pins"
    command: |
      V=$(sed -n 's/^atproto-identity = { version = "\(.*\)", path.*/\1/p' Cargo.toml)
      echo "workspace version $V"
      test -n "$V"
      grep -q "^atproto-identity = { version = \"$V\", path = \"../atproto-identity\", default-features = false }$" crates/atproto-record/Cargo.toml
      grep -q "^atproto-identity = { version = \"$V\", path = \"../atproto-identity\", default-features = false }$" crates/atproto-space/Cargo.toml
      grep -q "^atproto-record = { version = \"$V\", path = \"../atproto-record\", default-features = false }$" crates/atproto-space/Cargo.toml

  # `atproto-record` and `atproto-identity` promise a build with no HTTP
  # client, async runtime, or DNS resolver in the tree, so a consumer with a
  # no-I/O rule can import the wire types rather than redeclare them. Nothing
  # in the default build exercises that: features are additive, so the network
  # half compiles either way and the lean configuration only breaks when
  # somebody adds a `use`. `--all-targets` so the crates' own tests are held to
  # it too. The dependency graph itself is asserted by
  # `atproto-record --test lean_dependencies`, which the "test" step runs.
  - name: "lean build"
    command: cargo check -p atproto-record --no-default-features --all-targets && cargo check -p atproto-identity --no-default-features --all-targets && cargo check -p atproto-space --all-targets

  # Everything above runs in the dev profile, which is why a release-only
  # breakage survived: several crates derived `Debug` under
  # `cfg_attr(any(debug_assertions, test), ...)`, so downstream `derive(Debug)`
  # compiled in tests and failed in the shipped image — and nothing here ever
  # built one. This step is the Dockerfile's own feature set, so a container
  # that cannot build fails CI rather than the release.
  - name: "release build"
    command: cargo check --release --bins -F clap,hickory-dns,zeroize,tokio,smtp

  # Advisories against the locked dependency graph. The accepted ones live in
  # `.cargo/audit.toml`, each with the reason it is accepted; anything not on
  # that list fails here.
  #
  # `--deny warnings` because the unmaintained and unsound classes are the ones
  # that would otherwise accumulate silently -- `cargo audit` reports them but
  # exits 0 by default, which is indistinguishable from having none.
  #
  # This runs last on purpose. It is the only step whose result can change
  # without the tree changing, since it reads a database that moves on its own,
  # and a red build here means "a new advisory was published", not "this commit
  # broke something".
  - name: "audit"
    command: cargo audit --deny warnings
