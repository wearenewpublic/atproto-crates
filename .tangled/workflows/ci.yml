when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: "nixery"

# `rustup` rather than nixpkgs `cargo`/`rustc`/`clippy`, so the toolchain comes
# from `rust-toolchain.toml` instead of whatever version the nixpkgs channel
# happens to carry. Unpinned, CI and local development ran different compilers
# and disagreed about lints — a `clippy::const_is_empty` failure reached `main`
# green from a developer machine.
dependencies:
  nixpkgs:
    - rustup
    - git
    - pkg-config
    - openssl
    - cmake
    - gcc
    # From nixpkgs rather than `cargo install cargo-audit`, which would build
    # the tool from source on every run.
    - cargo-audit

steps:
  # Installs the toolchain named in rust-toolchain.toml and prints it, so the
  # version under test is visible in the log rather than inferred.
  - name: "toolchain"
    command: rustup show active-toolchain && cargo clippy --version

  # The `dasl-testing` submodule carries the DASL CBOR compliance fixtures.
  # Without it `cargo test` fails 13 cases in `atproto-dasl` on a missing
  # fixture file, so the checkout has to be recursive for the suite to mean
  # anything. The AT Protocol interop vectors are vendored at `tests/interop/`
  # rather than submoduled and need no setup.
  - name: "submodules"
    command: git submodule update --init --recursive

  - name: "fmt"
    command: cargo fmt --all -- --check

  # `--all-targets` covers tests, benches and examples, not just the library
  # and binary targets.
  - name: "clippy"
    command: cargo clippy --workspace --all-targets -- -D warnings

  # Plain `--workspace` rather than `--all-targets`, because `--all-targets`
  # silently drops doctests and this workspace documents its public API with
  # runnable examples.
  - name: "test"
    command: cargo test --workspace

  # Everything above runs in the dev profile, which is why a release-only
  # breakage survived: several crates derived `Debug` under
  # `cfg_attr(any(debug_assertions, test), ...)`, so downstream `derive(Debug)`
  # compiled in tests and failed in the shipped image — and nothing here ever
  # built one. This step is the Dockerfile's own feature set, so a container
  # that cannot build fails CI rather than the release.
  - name: "release build"
    command: cargo check --release --bins -F clap,hickory-dns,zeroize,tokio,smtp

  # Advisories against the locked dependency graph. The accepted ones live in
  # `.cargo/audit.toml`, each with the reason it is accepted; anything not on
  # that list fails here.
  #
  # `--deny warnings` because the unmaintained and unsound classes are the ones
  # that would otherwise accumulate silently -- `cargo audit` reports them but
  # exits 0 by default, which is indistinguishable from having none.
  #
  # This runs last on purpose. It is the only step whose result can change
  # without the tree changing, since it reads a database that moves on its own,
  # and a red build here means "a new advisory was published", not "this commit
  # broke something".
  - name: "audit"
    command: cargo audit --deny warnings
