[workspace]
members = [
    "crates/atpmcp",
    "crates/atproto-client",
    "crates/atproto-dasl",
    "crates/atproto-extras",
    "crates/atproto-identity",
    "crates/atproto-jetstream",
    "crates/atproto-oauth-aip",
    "crates/atproto-oauth-axum",
    "crates/atproto-oauth",
    "crates/atproto-record",
    "crates/atproto-repo",
    "crates/atproto-tap",
    "crates/atproto-xrpcs-helloworld",
    "crates/atproto-xrpcs",
    "crates/atproto-lexicon",
    "crates/atproto-attestation",
    "crates/atpxrpc",
]
exclude = [
    "crates/atproto-dasl/fuzz",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://tangled.org/ngerakines.me/atproto-crates"
authors = ["Nick Gerakines <nick.gerakines@gmail.com>"]
license = "MIT"
keywords = ["atprotocol"]
categories = ["command-line-utilities", "web-programming"]

[workspace.dependencies]
atproto-attestation = { version = "0.14.4", path = "crates/atproto-attestation" }
atproto-client = { version = "0.14.4", path = "crates/atproto-client" }
atproto-dasl = { version = "0.14.4", path = "crates/atproto-dasl" }
atproto-extras = { version = "0.14.4", path = "crates/atproto-extras" }
atproto-identity = { version = "0.14.4", path = "crates/atproto-identity" }
atproto-jetstream = { version = "0.14.4", path = "crates/atproto-jetstream" }
atproto-lexicon = { version = "0.14.4", path = "crates/atproto-lexicon" }
atproto-oauth = { version = "0.14.4", path = "crates/atproto-oauth" }
atproto-oauth-aip = { version = "0.14.4", path = "crates/atproto-oauth-aip" }
atproto-oauth-axum = { version = "0.14.4", path = "crates/atproto-oauth-axum" }
atproto-record = { version = "0.14.4", path = "crates/atproto-record" }
atproto-repo = { version = "0.14.4", path = "crates/atproto-repo" }
atproto-tap = { version = "0.14.4", path = "crates/atproto-tap" }
atproto-xrpcs = { version = "0.14.4", path = "crates/atproto-xrpcs" }

atpxrpc = { version = "0.14.4", path = "crates/atpxrpc" }

bitflags = "2"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
blake3 = "1.5"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
cid = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = { version = "0.5", features = ["html_reports"] }
compact_str = { version = "0.8", features = ["serde"] }
data-encoding = "2.5"
dirs = "6"
ecdsa = { version = "0.16", features = ["std"] }
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
elliptic-curve = { version = "0.13", features = ["jwk", "serde"] }
futures = "0.3"
hickory-resolver = { version = "0.25" }
idna = "1.0"
http = "1.3"
indexmap = { version = "2", features = ["serde"] }
itoa = "1.0"
k256 = "0.13"
lru = "0.12"
multibase = "0.9"
multihash = "0.19"
p256 = "0.13"
p384 = "0.13"
panproto-core = "0.12"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "json", "rustls-tls"] }
reqwest-chain = "1.0"
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
rpassword = "7.3"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1"
tokio-websockets = { version = "0.13", features = ["client", "rustls-native-roots", "fastrand", "ring"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.2"
unicode-segmentation = "1.10"
url = "2.5"
urlencoding = "2.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
proptest = "1.6"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
