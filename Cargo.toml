[workspace]
members = [
    "crates/atpmcp",
    "crates/atproto-client",
    "crates/atproto-dasl",
    "crates/atproto-extras",
    "crates/atproto-identity",
    "crates/atproto-jetstream",
    "crates/atproto-oauth-axum",
    "crates/atproto-oauth",
    "crates/atproto-pds",
    "crates/atproto-record",
    "crates/atproto-repo",
    "crates/atproto-space",
    "crates/atproto-tap",
    "crates/atproto-xrpcs",
    "crates/atproto-lexicon",
    "crates/atproto-attestation",
    "crates/atpxrpc",
]
exclude = [
    "crates/atproto-dasl/fuzz",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://tangled.org/ngerakines.me/atproto-crates"
authors = ["Nick Gerakines <nick.gerakines@gmail.com>"]
license = "MIT"
keywords = ["atprotocol"]
categories = ["command-line-utilities", "web-programming"]

[workspace.dependencies]
atproto-attestation = { version = "0.15.0-rc.3", path = "crates/atproto-attestation" }
atproto-client = { version = "0.15.0-rc.3", path = "crates/atproto-client" }
atproto-dasl = { version = "0.15.0-rc.3", path = "crates/atproto-dasl" }
atproto-extras = { version = "0.15.0-rc.3", path = "crates/atproto-extras" }
atproto-identity = { version = "0.15.0-rc.3", path = "crates/atproto-identity" }
atproto-jetstream = { version = "0.15.0-rc.3", path = "crates/atproto-jetstream" }
atproto-lexicon = { version = "0.15.0-rc.3", path = "crates/atproto-lexicon" }
atproto-oauth = { version = "0.15.0-rc.3", path = "crates/atproto-oauth" }
atproto-oauth-axum = { version = "0.15.0-rc.3", path = "crates/atproto-oauth-axum" }
atproto-pds = { version = "0.15.0-rc.3", path = "crates/atproto-pds" }
atproto-record = { version = "0.15.0-rc.3", path = "crates/atproto-record" }
atproto-repo = { version = "0.15.0-rc.3", path = "crates/atproto-repo" }
atproto-space = { version = "0.15.0-rc.3", path = "crates/atproto-space" }
atproto-tap = { version = "0.15.0-rc.3", path = "crates/atproto-tap" }
atproto-xrpcs = { version = "0.15.0-rc.3", path = "crates/atproto-xrpcs" }

atpxrpc = { version = "0.15.0-rc.3", path = "crates/atpxrpc" }

bitflags = "2"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
blake3 = "1.5"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
cid = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["html_reports"] }
compact_str = { version = "0.10", features = ["serde"] }
data-encoding = "2.10"
dirs = "6"
ecdsa = { version = "0.16", features = ["std"] }
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
elliptic-curve = { version = "0.13", features = ["jwk", "serde"] }
futures = "0.3"
hickory-resolver = { version = "0.26" }
idna = "1.0"
http = "1.4"
indexmap = { version = "2", features = ["serde"] }
itoa = "1.0"
k256 = "0.13"
fjall = "3"
lru = "0.18"
multibase = "0.9"
multihash = "0.19"
p256 = "0.13"
p384 = "0.13"
panproto-core = "0.26"
rand = "0.10"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "json", "rustls-tls"] }
reqwest-chain = "1.0"
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
rpassword = "7.3"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1"
tokio-websockets = { version = "0.13", features = ["client", "rustls-native-roots", "fastrand", "ring"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros", "migrate", "chrono"] }
tracing = { version = "0.1", features = ["async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"
prometheus-client = "0.25"
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "connection-manager"] }
aws-config = { version = "1.5", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.65", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-credential-types = "1.2"
ulid = "3.0"
unicode-segmentation = "1.13"
url = "2.5"
urlencoding = "2.1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "tracing"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
proptest = "1.11"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
