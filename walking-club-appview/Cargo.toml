[package]
name = "walking-club-appview"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Nick Gerakines <nick.gerakines@gmail.com>"]
description = "Walking Club AppView — confidential OAuth BFF + 0016 permissioned-data space consumer for the atproto-crates test cluster"
license = "MIT"
build = "build.rs"
publish = false
default-run = "walking_club_appview"
include = ["/src", "/templates", "/static", "/migrations", "/build.rs", "/LICENSE", "/README.md", "/Dockerfile"]

# REQUIRED: this crate lives INSIDE the atproto-crates repo, whose root Cargo.toml
# has an explicit `members` list that does NOT include this crate. Declaring an empty
# [workspace] table makes this directory a standalone workspace root. Path deps below
# still resolve through `../crates/*`, and those crates inherit version/edition/etc.
# from the PARENT workspace root (../Cargo.toml) via their own `*.workspace = true`.
[workspace]

[lib]
name = "walking_club_appview"
path = "src/lib.rs"

[[bin]]
name = "walking_club_appview"
path = "src/main.rs"

[features]
default = ["reload"]
embed = ["dep:minijinja-embed"]
reload = ["dep:minijinja-autoreload", "minijinja/loader"]

[build-dependencies]
minijinja-embed = { version = "2.7" }

[dependencies]
# ── In-tree AT Protocol crates (PATH deps, unpublished 0.15.0-rc.2) ──
atproto-identity = { path = "../crates/atproto-identity", features = ["hickory-dns", "lru"] }
atproto-oauth = { path = "../crates/atproto-oauth" }
atproto-oauth-axum = { path = "../crates/atproto-oauth-axum" }
atproto-client = { path = "../crates/atproto-client" }
atproto-record = { path = "../crates/atproto-record" }
atproto-dasl = { path = "../crates/atproto-dasl" }
atproto-space = { path = "../crates/atproto-space" }
atproto-repo = { path = "../crates/atproto-repo" }
atproto-xrpcs = { path = "../crates/atproto-xrpcs" }

# ── Web framework ──
axum = { version = "0.8", features = ["http2", "macros"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "timeout", "cors"] }

# ── Async runtime ──
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# ── Database (SQLite only — NO postgres, NO tls) ──
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "json",
    "chrono",
    "derive",
] }

# ── Templates (server-rendered HTML; no JS build) ──
minijinja = { version = "2.19", features = ["builtins", "json", "urlencode"] }
minijinja-autoreload = { version = "2.19", optional = true }
minijinja-embed = { version = "2.19", optional = true }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── HTTP client (rustls, no native TLS) ──
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Direct per-PDS firehose consumer (subscribeRepos WebSocket) ──
tokio-websockets = { version = "0.13", features = ["client", "rustls-native-roots", "fastrand", "ring"] }
cid = "0.11"

# ── OAuth session crypto, cookies, IDs ──
aes-gcm = "0.10"
rand = "0.10"
cookie = "0.18"
sha2 = "0.11"
subtle = "2"
ulid = "1.2"
base64 = "0.22"
hex = "0.4"

# ── Utilities ──
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "now", "serde"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = "0.3"
async-trait = "0.1"
urlencoding = "2.1"
serde_bytes = "0.11"

# ── Errors / logging / metrics ──
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus-client = "0.23"

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"
