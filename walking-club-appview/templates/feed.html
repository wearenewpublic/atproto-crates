{% extends "base.html" %}
{% block title %}Feed{% endblock %}
{% block content %}
<section class="feed">
  <h1>Feed</h1>
  <p class="muted feed-status" id="feed-status">Live &middot; updates every 15s</p>
  <div id="feed-fragment" data-poll="/feed/fragment">
    {% include "feed_fragment.html" %}
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
  // Inline live poll: re-fetch the server-rendered fragment and swap it in.
  // No JSON API, no framework — just a timed fetch of HTML.
  (function () {
    var target = document.getElementById('feed-fragment');
    var status = document.getElementById('feed-status');
    if (!target) return;
    var url = target.getAttribute('data-poll');
    async function refresh() {
      try {
        var resp = await fetch(url, { headers: { 'Accept': 'text/html' } });
        if (resp.status === 401) { window.location = '/'; return; }
        if (!resp.ok) return;
        target.innerHTML = await resp.text();
        if (status) status.textContent = 'Live · updated ' + new Date().toLocaleTimeString();
      } catch (e) { /* transient network error; retry next tick */ }
    }
    setInterval(refresh, 15000);
  })();
</script>
{% endblock %}
