{% extends "base.html" %}
{% block title %}Compose{% endblock %}
{% block content %}
<section class="compose">
  <h1>Compose</h1>
  <p id="compose-status" class="compose-status" role="status"></p>

  <form id="event-form" class="compose-form">
    <h2>New event</h2>
    <label for="event-name">Name</label>
    <input id="event-name" name="name" required>
    <label for="event-starts">Starts at</label>
    <input id="event-starts" name="starts_at" type="datetime-local" required>
    <label for="event-ends">Ends at</label>
    <input id="event-ends" name="ends_at" type="datetime-local">
    <button type="submit">Create event</button>
  </form>

  <form id="post-form" class="compose-form">
    <h2>New post</h2>
    <label for="post-text">Text</label>
    <textarea id="post-text" name="text" maxlength="300" required></textarea>
    <button type="submit">Create post</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
  // Submit the forms as JSON to the create endpoints. On success the record is
  // written to the member's own space repo; the firehose / notify loop will
  // surface it in the feed shortly after.
  (function () {
    var status = document.getElementById('compose-status');
    function show(msg, ok) {
      status.textContent = msg;
      status.className = 'compose-status ' + (ok ? 'ok' : 'err');
    }
    async function submit(form, url, build) {
      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var btn = form.querySelector('button');
        btn.disabled = true;
        try {
          var resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(build(new FormData(form)))
          });
          if (resp.status === 401) { window.location = '/'; return; }
          if (resp.ok) { show('Saved.', true); form.reset(); }
          else { show('Failed: ' + resp.status + ' ' + (await resp.text()), false); }
        } catch (e) {
          show('Network error.', false);
        } finally { btn.disabled = false; }
      });
    }
    var eventForm = document.getElementById('event-form');
    if (eventForm) submit(eventForm, '/api/compose/event', function (fd) {
      var body = { name: fd.get('name'), starts_at: fd.get('starts_at') };
      var ends = fd.get('ends_at');
      if (ends) body.ends_at = ends;
      return body;
    });
    var postForm = document.getElementById('post-form');
    if (postForm) submit(postForm, '/api/compose/post', function (fd) {
      return { text: fd.get('text') };
    });
  })();
</script>
{% endblock %}
